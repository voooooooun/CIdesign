			<h3>CI디자인이란?</h3>
			<p>- CI는 기업의 얼굴로서 그 기업의 이미지를 가장 상징적으로 표현해주는 시각물이다. 
			즉 짧은 시간에 보는 이에게 그 기업의 이미지를 강렬하게 전달해주어야한다.
			마케팅 관점에서 CI는 기업과 고객 그리고 사회를 연결해주는 시각적 커뮤니케이션 수단으로서 IMC(Integrated Marketing Communication)의 한 요소다.</p>
